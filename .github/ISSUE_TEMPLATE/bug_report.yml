name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, customer data, phone numbers, database dumps, or private URLs.
  - type: input
    id: wordpress
    attributes:
      label: WordPress version
      placeholder: e.g. 6.x
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: e.g. 8.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Active theme, relevant plugins, and hosting details (no secrets).
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error messages
      description: Remove secrets and personal data before posting.
    validations:
      required: false
